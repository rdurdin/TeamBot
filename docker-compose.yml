services:
  backend:
    build:
      context: ..
      dockerfile: web/Containerfile.backend
    container_name: teamagent-backend
    ports:
      - "8000:8000"
    volumes:
      - teamagent-data:/app/web/backend/data
    environment:
      - DATABASE_PATH=/app/web/backend/data/teamagent.db
      - MODEL_API=${MODEL_API}
      - USER_KEY=${USER_KEY}
      - MODEL_ID=${MODEL_ID:-claude-sonnet-4-6}
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: web/Containerfile.frontend
    container_name: teamagent-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  teamagent-data:
